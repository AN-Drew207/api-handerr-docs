<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Handerr API — Entorno y tokens</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔑</text></svg>" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f1115;
        --panel: #161a22;
        --panel-2: #1c2129;
        --fg: #e6e8ee;
        --muted: #9aa3b2;
        --border: #262b36;
        --accent: #6c8cff;
        --ok: #35c48a;
        --warn: #e0a13a;
        --err: #e06c6c;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 14px;
        line-height: 1.55;
      }
      header {
        display: flex; align-items: center; gap: 16px;
        height: 46px; padding: 0 16px;
        border-bottom: 1px solid var(--border); background: #0f1115;
        position: sticky; top: 0; z-index: 5;
      }
      header .brand { font-weight: 650; display: flex; align-items: center; gap: 8px; }
      header .brand span.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
      header .spacer { flex: 1; }
      a.btn, button {
        font: inherit; color: var(--fg); background: var(--panel-2);
        border: 1px solid var(--border); border-radius: 8px;
        padding: 6px 12px; cursor: pointer; text-decoration: none;
      }
      a.btn:hover, button:hover { border-color: #3a4152; background: #222836; }
      button.primary { background: var(--accent); border-color: var(--accent); color: #0b0e14; font-weight: 600; }
      button.primary:hover { background: #7f9bff; }
      button:disabled { opacity: .55; cursor: progress; }

      main { max-width: 940px; margin: 0 auto; padding: 28px 20px 80px; }
      h1 { font-size: 20px; margin: 0 0 6px; letter-spacing: -0.01em; }
      p.lead { color: var(--muted); margin: 0 0 24px; }

      .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 18px; overflow: hidden; }
      .card > .head {
        display: flex; align-items: center; gap: 12px;
        padding: 14px 18px; border-bottom: 1px solid var(--border); background: #131720;
      }
      .card > .head h2 { font-size: 15px; margin: 0; }
      .card > .head .spacer { flex: 1; }
      .card > .body { padding: 18px; }

      .grid { display: grid; grid-template-columns: 170px 1fr; gap: 10px 14px; align-items: center; }
      label { color: var(--muted); font-size: 13px; }
      input {
        width: 100%; font: inherit; color: var(--fg); background: var(--panel-2);
        border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px;
      }
      input:focus { outline: none; border-color: var(--accent); }
      input::placeholder { color: #5b6474; }

      .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px;
              background: var(--panel-2); border: 1px solid var(--border); color: var(--muted); font-size: 12px; }
      .pill .led { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
      .pill.ok .led { background: var(--ok); }
      .pill.warn .led { background: var(--warn); }
      .pill.err .led { background: var(--err); }

      .section-title { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted);
                       margin: 22px 0 10px; padding-top: 16px; border-top: 1px dashed var(--border); }
      .section-title:first-child { margin-top: 0; padding-top: 0; border-top: none; }

      .vars { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; }
      .vars .row { display: grid; grid-template-columns: 130px 1fr; gap: 8px; align-items: center; }
      .vars .row label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }

      .servers .row { display: grid; grid-template-columns: 1fr 190px; gap: 8px; margin-bottom: 8px; }

      .note { color: var(--muted); font-size: 12.5px; margin-top: 10px; }
      .note code { background: #1f2530; padding: 1px 5px; border-radius: 4px; }
      .danger { color: var(--warn); }

      #toast {
        position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
        background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px;
        padding: 10px 16px; opacity: 0; transition: opacity .18s; pointer-events: none; max-width: 80vw;
      }
      #toast.show { opacity: 1; }
      #toast.error { border-color: var(--err); color: #ffc9c9; }

      .savebar { position: sticky; bottom: 0; display: flex; gap: 10px; align-items: center;
                 padding: 14px 0; background: linear-gradient(transparent, var(--bg) 35%); }
    </style>
  </head>
  <body>
    <header>
      <div class="brand"><span class="dot"></span> Handerr API</div>
      <div class="spacer"></div>
      <a class="btn" href="/">← Volver a la referencia</a>
    </header>

    <main>
      <h1>Entorno y tokens</h1>
      <p class="lead">
        Lo que configures aquí se guarda en <code>api-docs/env.local.json</code>, fuera de los repos.
        El proxy local sustituye cada <code>{{variable}}</code> al ejecutar una petición y renueva el
        token de Cognito por su cuenta.
      </p>

      <div id="profiles"></div>

      <div class="savebar">
        <button class="primary" id="save">Guardar cambios</button>
        <span class="pill" id="savehint"><span class="led"></span> sin cambios sin guardar</span>
      </div>
    </main>

    <div id="toast"></div>

    <script>
      let state = null;

      const toast = (message, isError) => {
        const el = document.getElementById('toast');
        el.textContent = message;
        el.className = 'show' + (isError ? ' error' : '');
        setTimeout(() => (el.className = ''), isError ? 6000 : 2600);
      };

      const el = (tag, props = {}, children = []) => {
        const node = Object.assign(document.createElement(tag), props);
        for (const child of [].concat(children)) {
          node.append(child instanceof Node ? child : document.createTextNode(child));
        }
        return node;
      };

      function statusPill(status) {
        if (!status?.hasToken) return el('span', { className: 'pill err' }, [el('span', { className: 'led' }), 'sin token']);
        if (status.expired) {
          return status.hasRefreshToken
            ? el('span', { className: 'pill warn' }, [el('span', { className: 'led' }), 'expirado — se renueva solo'])
            : el('span', { className: 'pill err' }, [el('span', { className: 'led' }), 'expirado']);
        }
        const minutes = Math.max(0, Math.round(status.expiresInSeconds / 60));
        return el('span', { className: 'pill ok' }, [el('span', { className: 'led' }), 'token válido ' + minutes + ' min']);
      }

      function field(label, value, onInput, placeholder, type) {
        const input = el('input', { value: value ?? '', placeholder: placeholder || '', type: type || 'text' });
        input.addEventListener('input', () => { onInput(input.value); markDirty(); });
        return [el('label', {}, label), input];
      }

      let dirty = false;
      function markDirty() {
        dirty = true;
        const hint = document.getElementById('savehint');
        hint.className = 'pill warn';
        hint.innerHTML = '<span class="led"></span> cambios sin guardar';
      }

      function renderProfile(name, profile, status) {
        const body = el('div', { className: 'body' });

        // ── Servers ──────────────────────────────────────────────
        body.append(el('div', { className: 'section-title' }, 'Servidores'));
        const servers = el('div', { className: 'servers' });
        (profile.servers ||= []).forEach((server, i) => {
          const url = el('input', { value: server.url || '', placeholder: 'https://…' });
          const description = el('input', { value: server.description || '', placeholder: 'etiqueta' });
          url.addEventListener('input', () => { profile.servers[i].url = url.value; markDirty(); });
          description.addEventListener('input', () => { profile.servers[i].description = description.value; markDirty(); });
          servers.append(el('div', { className: 'row' }, [url, description]));
        });
        body.append(servers);
        body.append(
          el('div', { className: 'note' }, [
            'Tras cambiar un servidor, vuelve a generar los documentos: ',
            el('code', {}, 'npm run build'),
            '.',
          ]),
        );

        // ── Cognito ──────────────────────────────────────────────
        if (profile.cognito) {
          body.append(el('div', { className: 'section-title' }, 'Cognito'));
          const grid = el('div', { className: 'grid' });
          const c = profile.cognito;
          grid.append(...field('Region', c.region, (v) => (c.region = v), 'us-east-1'));
          grid.append(...field('App client ID', c.clientId, (v) => (c.clientId = v), '1a2b3c…'));

          // The backoffice client does not allow USER_PASSWORD_AUTH, so it logs
          // in through AdminInitiateAuth, which needs the pool id and AWS creds.
          const adminFlow = c.authFlow === 'ADMIN_USER_PASSWORD_AUTH' || c.authFlow === 'USER_SRP_AUTH';
          if (adminFlow) {
            grid.append(...field('User pool ID', c.userPoolId, (v) => (c.userPoolId = v), 'us-east-1_XXXXXXXXX'));
          }

          grid.append(...field('Usuario', c.username, (v) => (c.username = v), 'correo@ejemplo.com'));
          // A stored password arrives as the `__KEEP__` sentinel: show the field
          // empty so it is obvious that typing replaces it, and leave the
          // sentinel in place when the user does not touch it.
          const stored = c.password === '__KEEP__';
          grid.append(
            ...field(
              'Contraseña',
              stored ? '' : c.password,
              (v) => (c.password = v === '' && stored ? '__KEEP__' : v),
              stored ? 'guardada — escribe para reemplazarla' : 'se guarda en env.local.json',
              'password',
            ),
          );
          grid.append(...field('…o variable de entorno', c.passwordEnv, (v) => (c.passwordEnv = v), 'HANDERR_APP_PASSWORD'));
          body.append(grid);
          body.append(
            el('div', { className: 'note' }, [
              el('span', { className: 'danger' }, 'Preferible: '),
              'deja la contraseña vacía y exporta ',
              el('code', {}, (c.passwordEnv || 'HANDERR_PASSWORD') + '=…'),
              ' antes de arrancar el servidor; así no queda escrita en disco.',
            ]),
          );

          if (adminFlow) {
            body.append(
              el('div', { className: 'note' }, [
                'Este pool usa ',
                el('code', {}, 'ADMIN_USER_PASSWORD_AUTH'),
                ': el login va firmado con tus credenciales de AWS (perfil ',
                el('code', {}, c.awsProfile || 'default'),
                '). Las renovaciones posteriores ya no las necesitan.',
              ]),
            );
          }
        }

        // ── Variables ────────────────────────────────────────────
        body.append(el('div', { className: 'section-title' }, 'Variables'));
        const vars = el('div', { className: 'vars' });
        const varEntries = Object.entries((profile.vars ||= {}));
        for (const [key, value] of varEntries) {
          const input = el('input', { value: value ?? '', placeholder: '{{' + key + '}}' });
          input.addEventListener('input', () => { profile.vars[key] = input.value; markDirty(); });
          vars.append(el('div', { className: 'row' }, [el('label', {}, key), input]));
        }
        body.append(vars);

        const newKey = el('input', { placeholder: 'nueva variable (ej. serviceId)' });
        const addButton = el('button', {}, '+ añadir');
        addButton.addEventListener('click', () => {
          const key = newKey.value.trim();
          if (!key) return;
          profile.vars[key] = '';
          markDirty();
          render();
        });
        body.append(el('div', { className: 'servers', style: 'margin-top:10px' }, [
          el('div', { className: 'row' }, [newKey, addButton]),
        ]));

        // ── Header ───────────────────────────────────────────────
        const head = el('div', { className: 'head' }, [
          el('h2', {}, profile.label || name),
          el('span', { className: 'pill' }, ['perfil ' + name]),
          el('div', { className: 'spacer' }),
        ]);
        head.append(statusPill(status));

        if (profile.cognito) {
          const loginButton = el('button', {}, 'Obtener token');
          loginButton.addEventListener('click', async () => {
            loginButton.disabled = true;
            loginButton.textContent = 'Entrando…';
            try {
              await save({ silent: true });
              const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ profile: name }),
              });
              const data = await res.json();
              if (!res.ok) throw new Error(data.error || 'fallo el login');
              toast('Token obtenido para "' + name + '"');
              await load();
            } catch (err) {
              toast(err.message, true);
              loginButton.disabled = false;
              loginButton.textContent = 'Obtener token';
            }
          });
          head.append(loginButton);

          const logoutButton = el('button', {}, 'Borrar');
          logoutButton.addEventListener('click', async () => {
            await fetch('/api/auth/logout', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ profile: name }),
            });
            toast('Tokens de "' + name + '" borrados');
            load();
          });
          head.append(logoutButton);
        }

        return el('div', { className: 'card' }, [head, body]);
      }

      function render() {
        const container = document.getElementById('profiles');
        container.innerHTML = '';
        for (const [name, profile] of Object.entries(state.env.profiles || {})) {
          container.append(renderProfile(name, profile, state.tokens?.[name]));
        }
      }

      async function load() {
        const res = await fetch('/api/env');
        state = await res.json();
        dirty = false;
        const hint = document.getElementById('savehint');
        hint.className = 'pill ok';
        hint.innerHTML = '<span class="led"></span> guardado';
        render();
      }

      async function save({ silent } = {}) {
        const res = await fetch('/api/env', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          // The version we loaded with: the server rejects the save if the file
          // changed underneath us instead of overwriting the newer values.
          body: JSON.stringify({ env: state.env, version: state.version }),
        });
        const data = await res.json();
        if (res.status === 409) {
          await load();
          throw new Error(data.error + ' Se recargó con los valores actuales — revisa y vuelve a guardar.');
        }
        if (!res.ok) throw new Error(data.error || 'no se pudo guardar');
        state.version = data.version || state.version;
        dirty = false;
        const hint = document.getElementById('savehint');
        hint.className = 'pill ok';
        hint.innerHTML = '<span class="led"></span> guardado';
        if (!silent) toast('Entorno guardado');
      }

      document.getElementById('save').addEventListener('click', async () => {
        try {
          await save();
        } catch (err) {
          toast(err.message, true);
        }
      });

      window.addEventListener('beforeunload', (event) => {
        if (dirty) event.preventDefault();
      });

      load();
    </script>
  </body>
</html>
